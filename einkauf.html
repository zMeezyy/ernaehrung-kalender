<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Einkauf"><title>Einkaufsliste Rewe</title>
<style id="pagestyle">
*{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: eine schmale Spalte wie ein Einkaufszettel, Abteilungen in Laufreihenfolge */
:root{--bg:#f6f7f4;--card:#ffffff;--fg:#1d2a22;--muted:#66746b;--line:#dfe4dd;--accent:#2f7d4f;--done:#9aa69f;
--sans:"Inter",system-ui,-apple-system,sans-serif;--head:"Space Grotesk","Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1a221d;--fg:#e6ece7;--muted:#9aa89f;--line:#2b362f;--accent:#5cc184;--done:#5f6d64;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1a221d;--fg:#e6ece7;--muted:#9aa89f;--line:#2b362f;--accent:#5cc184;--done:#5f6d64;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1{font-family:var(--head);font-size:1.6rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2;display:grid;gap:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.prog>i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stat{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
section h2{font-family:var(--head);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
li+li{border-top:1px solid var(--line)}
label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer;min-width:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.t{flex:1;min-width:0}.n{font-weight:600}.m{color:var(--muted);font-size:.85rem}
.p{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
li.ok .n,li.ok .p{color:var(--done);text-decoration:line-through}
.hint{font-size:.88rem;color:var(--muted);line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save{font-size:.82rem;color:var(--muted)}
</style></head><body>
<div class="wrap" id="app"><h1>Einkaufsliste</h1><p class="sub">Wird geladen…</p></div>

<script id="appjs">
(function(){
const stEl=document.getElementById('state');let S=JSON.parse(stEl.textContent);
const app=document.getElementById('app');let art=null,timer=null,saveMsg='';
const eur=v=>v.toFixed(2).replace('.',',')+' €';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 const done=S.items.filter(i=>i.ok).length,tot=S.items.reduce((a,i)=>a+i.preis,0),inC=S.items.filter(i=>i.ok).reduce((a,i)=>a+i.preis,0);
 const groups=[];S.items.forEach(i=>{let g=groups.find(g=>g.n===i.abt);if(!g)groups.push(g={n:i.abt,a:[]});g.a.push(i)});
 app.innerHTML=`<header><h1>Einkaufsliste</h1><p class="sub">Rewe · Dienstag ${esc(S.woche)} · Preise geschätzt</p></header>
 <div class="bar"><div class="prog"><i style="width:${S.items.length?done/S.items.length*100:0}%"></i></div>
 <div class="stat"><span>${done} von ${S.items.length} im Wagen</span><span>${eur(inC)} von ca. ${eur(tot)}</span></div></div>
 ${groups.map(g=>`<section><h2>${esc(g.n)}</h2><ul>${g.a.map(i=>`<li class="${i.ok?'ok':''}"><label for="${i.id}"><input type="checkbox" id="${i.id}" ${i.ok?'checked':''}><span class="t"><span class="n">${esc(i.name)}</span><br><span class="m">${esc(i.menge)}${i.hinweis?' · '+esc(i.hinweis):''}</span></span><span class="p">${eur(i.preis)}</span></label></li>`).join('')}</ul></section>`).join('')}
 <p class="hint"><b>Nicht kaufen, ist noch da:</b> ${esc(S.extra)}. Kurz nachschauen, die Mengen sind errechnet.</p>
 <div class="row"><button type="button" id="reset">Alle Haken entfernen</button><span class="save" id="save">${esc(saveMsg)}</span></div>`;
 app.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{const it=S.items.find(i=>i.id===cb.id);it.ok=cb.checked;render();queue()}));
 document.getElementById('reset').addEventListener('click',()=>{S.items.forEach(i=>i.ok=false);render();queue()});
}
function setMsg(m){saveMsg=m;const e=document.getElementById('save');if(e)e.textContent=m}
const KEY='einkauf-'+S.woche;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');S.items.forEach(i=>{if(saved.includes(i.id))i.ok=true})}catch(e){}
function queue(){try{localStorage.setItem(KEY,JSON.stringify(S.items.filter(i=>i.ok).map(i=>i.id)));setMsg('Auf diesem iPhone gespeichert')}catch(e){setMsg('Speichern nicht möglich (privates Surfen?)')}}
render();
})();
</script></body></html>
